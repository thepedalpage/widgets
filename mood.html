<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mood Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE4EC;--digit:#F06292;--text:#8D6E7A;--soft:#FFF5F8;--mid:#F8B4C8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent}
body{font-family:'Fredoka',system-ui,sans-serif;display:flex;padding:10px}
.card{background:var(--bg);border:4px dashed var(--mid);border-radius:26px;padding:18px 20px;width:100%;
 color:var(--text);position:relative;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.card:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#fff;opacity:.4;top:-80px;right:-50px}
.head{position:relative;text-align:center;margin-bottom:12px}
h1{font-size:19px;font-weight:600;color:var(--digit)}
.sub{font-size:11.5px;opacity:.85;margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;position:relative}
.day{background:#fff;border-radius:16px;padding:9px 2px;text-align:center;cursor:pointer;border:2px solid transparent;transition:.15s;user-select:none}
.day:hover{transform:translateY(-2px);border-color:var(--mid)}
.day.today{border-color:var(--digit)}
.dn{font-size:10.5px;font-weight:500;opacity:.75}
.face{font-size:24px;line-height:1.25}
.dt{font-size:9.5px;opacity:.55}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px;position:relative}
.lg{background:var(--soft);border-radius:12px;padding:4px 9px;font-size:10.5px;display:flex;align-items:center;gap:4px}
.foot{position:relative;text-align:center;font-size:11px;margin-top:10px;opacity:.9}
.foot b{color:var(--digit)}
@media(max-width:560px){
 .card{padding:14px;border-radius:20px}
 h1{font-size:16px}.face{font-size:20px}.week{gap:5px}.lg{font-size:9.5px;padding:3px 7px}
}
</style>
</head><body>
<div class="card">
 <div class="head"><h1>🎀 Mood Tracker ♡</h1><div class="sub">tap a day to set how you feel</div></div>
 <div class="week" id="week"></div>
 <div class="legend" id="legend"></div>
 <div class="foot" id="foot"></div>
</div>
<script>
var MOODS=[["🤍","not yet"],["🥰","lovely"],["😊","good"],["😌","calm"],["😐","okay"],["🥺","low"],["😴","tired"]];
var P=new URLSearchParams(location.search);
['bg','digit','text'].forEach(function(k){var v=P.get(k);if(v&&/^[0-9a-fA-F]{6}$/.test(v))document.documentElement.style.setProperty('--'+k,'#'+v)});
function key(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function load(){try{return JSON.parse(localStorage.getItem('mood')||'{}')||{}}catch(e){return {}}}
function save(v){try{localStorage.setItem('mood',JSON.stringify(v))}catch(e){}}
var data=load(),today=new Date();
var start=new Date(today); start.setDate(today.getDate()-today.getDay());
var DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var week=document.getElementById('week');
function draw(){
 week.innerHTML='';
 for(var i=0;i<7;i++){
  var d=new Date(start); d.setDate(start.getDate()+i);
  var k=key(d), m=data[k]||0;
  var el=document.createElement('div');
  el.className='day'+(k===key(today)?' today':'');
  el.innerHTML='<div class="dn">'+DN[i]+'</div><div class="face">'+MOODS[m][0]+'</div><div class="dt">'+d.getDate()+'</div>';
  (function(k){el.onclick=function(){data[k]=((data[k]||0)+1)%MOODS.length;save(data);draw()}})(k);
  week.appendChild(el);
 }
 var done=0,i2;
 for(i2=0;i2<7;i2++){var dd=new Date(start);dd.setDate(start.getDate()+i2);if(data[key(dd)])done++}
 document.getElementById('foot').innerHTML='this week logged: <b>'+done+' / 7</b> ♡';
}
var lg=document.getElementById('legend');
MOODS.slice(1).forEach(function(m){var s=document.createElement('div');s.className='lg';s.innerHTML='<span>'+m[0]+'</span>'+m[1];lg.appendChild(s)});
draw();
</script></body></html>
