<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE4EC;--digit:#F06292;--text:#8D6E7A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent;height:100%}
body{font-family:'Fredoka',system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:2vw}
.card{background:var(--bg);border-radius:6vw;padding:6vw 4vw;width:100%;text-align:center;color:var(--text);position:relative;overflow:hidden}
.card:before{content:"";position:absolute;width:30vw;height:30vw;border-radius:50%;background:#fff;opacity:.35;top:-10vw;right:-8vw}
.time{display:flex;justify-content:center;align-items:center;gap:2vw;position:relative}
.box{background:var(--digit);color:#fff;font-size:clamp(31px,13vw,68px);font-weight:600;border-radius:4vw;padding:1vw 3vw;min-width:22vw;line-height:1.1}
.colon{font-size:clamp(24px,10vw,52px);color:var(--digit);font-weight:600;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.ampm{font-size:clamp(11px,4.5vw,23px);font-weight:500;color:var(--digit);align-self:flex-end;margin-bottom:2vw}
.date{font-size:clamp(11px,4.5vw,23px);font-weight:500;margin-top:4vw;position:relative}
</style><style>
/* uniform size: card always fills the embed box */
html,body{height:100%;margin:0}
body{min-height:100%;padding:2vw;display:flex;align-items:stretch;justify-content:center;box-sizing:border-box}
.card{width:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;overflow:auto}
</style>

<style id="resp">
/* --- responsive polish: keeps the desktop look, fixes narrow screens --- */
*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{padding:clamp(5px,2vw,16px)}
.card{width:100%;max-width:100%;box-sizing:border-box}
img,svg,canvas,iframe{max-width:100%}
input,select,button,textarea{max-width:100%;font-family:inherit}
@media (max-width:768px){
  body{padding:clamp(4px,1.6vw,10px)}
  .card{border-radius:clamp(14px,6vw,26px)}
}
</style>
</head><body>
<div class="card"><div class="time"><div class="box" id="h">00</div><div class="colon">:</div><div class="box" id="m">00</div><div class="ampm" id="ap"></div></div><div class="date" id="date"></div></div>
<script>
const p=new URLSearchParams(location.search);const h24=p.get('format')==='24';
['bg','digit','text'].forEach(k=>{const v=p.get(k);if(v&&/^[0-9a-fA-F]{6}$/.test(v))document.documentElement.style.setProperty('--'+k,'#'+v)});
function tick(){const n=new Date();let h=n.getHours();const ap=h>=12?'PM':'AM';if(!h24){h=h%12||12}
document.getElementById('h').textContent=String(h).padStart(2,'0');
document.getElementById('m').textContent=String(n.getMinutes()).padStart(2,'0');
document.getElementById('ap').textContent=h24?'':ap;
document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
tick();setInterval(tick,1000);
</script></body></html>
