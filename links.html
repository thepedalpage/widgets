<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quick Links</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE4EC;--digit:#F06292;--text:#8D6E7A;--soft:#FFF5F8;--mid:#F8B4C8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:transparent}
body{font-family:'Fredoka',system-ui,sans-serif;display:flex;padding:10px}
.card{background:var(--bg);border:4px dashed var(--mid);border-radius:26px;padding:18px 20px;width:100%;
 color:var(--text);position:relative;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.card:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#fff;opacity:.4;top:-80px;right:-50px}
.head{display:flex;align-items:center;justify-content:space-between;position:relative;margin-bottom:12px}
h1{font-size:19px;font-weight:600;color:var(--digit)}
.edit{background:var(--soft);border:none;border-radius:14px;padding:6px 14px;font-family:inherit;font-size:12px;color:var(--text);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;position:relative}
a.tile,div.tile{background:#fff;border-radius:18px;padding:14px 6px;text-align:center;text-decoration:none;color:var(--text);display:block;border:2px solid transparent;transition:.15s}
a.tile:hover{border-color:var(--mid);transform:translateY(-2px)}
.ico{font-size:28px;line-height:1}
.nm{font-size:12px;margin-top:6px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add{background:var(--soft);cursor:pointer}
form{position:relative;margin-top:14px;display:none}
form.on{display:block}
.row{display:grid;grid-template-columns:56px 1fr 1.4fr auto;gap:8px;margin-bottom:8px;align-items:center}
input{width:100%;border:2px solid var(--mid);border-radius:12px;padding:8px 10px;font-family:inherit;font-size:13px;color:var(--text);background:#fff;outline:none}
.del{background:var(--soft);border:none;border-radius:12px;color:var(--digit);font-size:15px;cursor:pointer;padding:8px 12px}
.actions{display:flex;gap:10px;margin-top:8px}
.actions button{flex:1;border:none;border-radius:16px;padding:11px;font-family:inherit;font-size:13px;cursor:pointer;background:var(--digit);color:#fff}
.actions .alt{background:var(--soft);color:var(--text)}
.hint{font-size:11px;text-align:center;margin-top:8px;opacity:.8;position:relative}
@media(max-width:560px){
 .card{border-radius:20px;padding:14px}
 h1{font-size:16px}.ico{font-size:24px}.nm{font-size:11px}
 .grid{grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px}
}
</style>
</head><body>
<div class="card">
 <div class="head"><h1>🎀 Quick Links ♡</h1><button class="edit" id="edit">edit</button></div>
 <div class="grid" id="grid"></div>
 <form id="form">
  <div id="rows"></div>
  <div class="actions"><button type="button" id="addRow" class="alt">+ Add link</button><button type="button" id="save">Save</button></div>
  <div class="hint">Tip: pick any emoji as the icon ♡</div>
 </form>
</div>
<script>
var DEF=[["📧","Gmail","https://mail.google.com"],["📁","Drive","https://drive.google.com"],["🎨","Canva","https://www.canva.com"],["🤍","ChatGPT","https://chatgpt.com"],["▶️","YouTube","https://www.youtube.com"],["📌","Pinterest","https://www.pinterest.com"],["🎵","Spotify","https://open.spotify.com"],["📝","Notion","https://www.notion.com/templates"]];
var P=new URLSearchParams(location.search);
['bg','digit','text'].forEach(function(k){var v=P.get(k);if(v&&/^[0-9a-fA-F]{6}$/.test(v))document.documentElement.style.setProperty('--'+k,'#'+v)});
function load(){try{var s=JSON.parse(localStorage.getItem('links')||'null');if(s&&s.length)return s}catch(e){}return DEF.slice()}
function save(v){try{localStorage.setItem('links',JSON.stringify(v))}catch(e){}}
var links=load();
var grid=document.getElementById('grid'),rows=document.getElementById('rows'),form=document.getElementById('form');
function draw(){
 grid.innerHTML='';
 links.forEach(function(l){
  var a=document.createElement('a');a.className='tile';a.href=l[2];a.target='_blank';a.rel='noopener';
  a.innerHTML='<div class="ico">'+l[0]+'</div><div class="nm">'+l[1]+'</div>';
  grid.appendChild(a)});
 var add=document.createElement('div');add.className='tile add';
 add.innerHTML='<div class="ico">➕</div><div class="nm">add</div>';
 add.onclick=function(){openForm();addRow('🔗','','')};
 grid.appendChild(add);
}
function addRow(i,n,u){
 var r=document.createElement('div');r.className='row';
 r.innerHTML='<input value="'+i+'" aria-label="Icon"><input value="'+n+'" placeholder="Name" aria-label="Name"><input value="'+u+'" placeholder="https://..." aria-label="Link"><button type="button" class="del" aria-label="Remove">×</button>';
 r.querySelector('.del').onclick=function(){r.remove()};
 rows.appendChild(r);
}
function openForm(){
 if(!form.classList.contains('on')){rows.innerHTML='';links.forEach(function(l){addRow(l[0],l[1],l[2])});form.classList.add('on')}
}
document.getElementById('edit').onclick=function(){
 if(form.classList.contains('on')){form.classList.remove('on')}else{openForm()}};
document.getElementById('addRow').onclick=function(){addRow('🔗','','')};
document.getElementById('save').onclick=function(){
 var out=[];
 rows.querySelectorAll('.row').forEach(function(r){
  var v=r.querySelectorAll('input');
  var ic=v[0].value.trim()||'🔗',nm=v[1].value.trim(),u=v[2].value.trim();
  if(!nm||!u)return;
  if(!/^https?:\/\//i.test(u))u='https://'+u;
  out.push([ic,nm,u])});
 if(out.length){links=out;save(links);draw()}
 form.classList.remove('on');
};
draw();
</script></body></html>
