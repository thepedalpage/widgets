<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exam Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE4EC;--digit:#F06292;--text:#8D6E7A;--soft:#FFF5F8;--mid:#F8B4C8}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{font-family:'Fredoka',system-ui,sans-serif;display:flex;justify-content:center;padding:2vw}
.card{background:var(--bg);border:1vw dashed var(--mid);border-radius:7vw;padding:5vw;width:100%;color:var(--text);text-align:center;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;width:30vw;height:30vw;border-radius:50%;background:#fff;opacity:.4;top:-12vw;right:-8vw}
h1{font-size:clamp(12px,5vw,26px);color:var(--digit);font-weight:600;position:relative}
.days{font-size:clamp(46px,19vw,99px);font-weight:600;color:var(--digit);line-height:1.05;position:relative}
.lbl{font-size:clamp(11px,4vw,21px);position:relative}
.date{font-size:clamp(11px,3.3vw,17px);margin-top:1vw;position:relative}
.bar{height:3.5vw;background:var(--soft);border-radius:3vw;margin-top:4vw;overflow:hidden;position:relative}
.fill{height:100%;background:var(--digit)}
.form{margin-top:3.5vw;position:relative}
input{width:100%;border:.6vw solid var(--mid);border-radius:4vw;padding:2.5vw;font-family:inherit;font-size:clamp(11px,3.4vw,18px);color:var(--text);background:#fff;outline:none;margin-bottom:1.6vw}
button{width:100%;border:none;border-radius:4vw;padding:2.6vw;font-family:inherit;font-size:clamp(11px,3.6vw,19px);background:var(--digit);color:#fff;cursor:pointer}
.small{background:var(--soft);color:var(--text);margin-top:2.5vw}
</style><style>
/* uniform size: card always fills the embed box */
html,body{height:100%;margin:0}
body{min-height:100%;padding:2vw;display:flex;align-items:stretch;justify-content:center;box-sizing:border-box}
.card{width:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box;overflow:auto}
</style>

<style id="resp">
/* --- responsive polish: keeps the desktop look, fixes narrow screens --- */
*{min-width:0}
html,body{max-width:100%;overflow-x:hidden}
body{padding:clamp(5px,2vw,16px)}
.card{width:100%;max-width:100%;box-sizing:border-box}
img,svg,canvas,iframe{max-width:100%}
input,select,button,textarea{max-width:100%;font-family:inherit}
@media (max-width:768px){
  body{padding:clamp(4px,1.6vw,10px)}
  .card{border-radius:clamp(14px,6vw,26px)}
}
</style>
</head><body>
<div class="card" id="card"></div>
<script>
var P=new URLSearchParams(location.search);
var card=document.getElementById('card');
function daysTo(d){var a=new Date();a.setHours(0,0,0,0);var b=new Date(d+'T00:00:00');return Math.round((b-a)/86400000)}
function form(){
 card.innerHTML='<h1>⏳ Countdown</h1><div class="form">'+
 '<input id="nm" placeholder="Counting down to... (e.g. Finals)" aria-label="Name">'+
 '<input id="dt" type="date" aria-label="Date"><button id="sv">Start countdown</button></div>';
 document.getElementById('sv').onclick=function(){
  var nm=document.getElementById('nm').value.trim()||'Countdown';
  var dt=document.getElementById('dt').value;
  if(!dt)return;
  var total=Math.max(1,daysTo(dt));
  try{localStorage.setItem('cd',JSON.stringify({nm:nm,dt:dt,total:total}))}catch(e){}
  show(nm,dt,total);
 };
}
function show(name,date,total){
 var n=daysTo(date);
 if(isNaN(n)){form();return}
 var pct=total&&total>0?Math.max(0,Math.min(100,(1-n/total)*100)):0;
 var d=new Date(date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 card.innerHTML='<h1>⏳ '+name+'</h1>'+
 '<div class="days">'+(n>0?n:(n===0?'🌸':'♡'))+'</div>'+
 '<div class="lbl">'+(n>1?'days to go':(n===1?'1 day to go':(n===0?'it is today!':'all done')))+'</div>'+
 '<div class="date">'+d+'</div>'+
 '<div class="bar"><div class="fill" style="width:'+pct+'%"></div></div>'+
 '<button class="small" id="chg">Change date</button>';
 document.getElementById('chg').onclick=form;
}
var saved=null;try{saved=JSON.parse(localStorage.getItem('cd')||'null')}catch(e){}
var qd=P.get('date');
if(qd)show(P.get('name')||'Countdown',qd,parseInt(P.get('total'))||Math.max(1,daysTo(qd)));
else if(saved)show(saved.nm,saved.dt,saved.total);
else form();
</script></body></html>
